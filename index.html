<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a4a68" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>紅海過乾地 Red Sea 3D</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="gameCanvas" aria-label="紅海過乾地 3D 遊戲畫面"></canvas>

      <!-- 頂部:階段 + 過海進度 -->
      <header class="topbar">
        <span id="phaseLabel" class="phase-label">伸杖</span>
        <div class="storm-panel" id="stormPanel" hidden>
          <span class="storm-cap">過海進度</span>
          <div class="storm-track"><div class="storm-fill" id="stormFill"></div></div>
        </div>
      </header>

      <!-- 隊伍聚攏度(中下方大條) -->
      <div class="flood-panel" id="floodPanel" hidden>
        <span id="floodLabel">隊伍聚攏</span>
        <div class="flood-track"><div class="flood-fill" id="floodFill"></div></div>
      </div>

      <div class="message-ribbon" id="statusMessage">選擇難度後開始。</div>
      <div class="commentary-bar" id="commentaryBar" hidden></div>

      <!-- 劇情按鍵提示(摩西伸杖) -->
      <button class="action-prompt" id="actionPrompt" hidden>▶</button>

      <!-- 操作提示 -->
      <div class="controls-panel" id="controlsPanel" hidden>
        <div id="controlsHint">A/D 或 ←/→ 左右導引隊伍 ・ V 視角 ・ 出現提示時 Enter/點按 推進劇情</div>
      </div>

      <!-- 觸控(按住式) -->
      <div class="touch-controls" id="touchControls">
        <button id="touchLeft" class="touch-action alt">◀</button>
        <button id="touchRight" class="touch-action alt">▶</button>
      </div>

      <div class="hud-buttons">
        <button id="menuButton">選單</button>
        <button id="audioButton">音效開啟</button>
        <button id="cameraButton">視角</button>
        <button id="fullscreenButton" title="全螢幕">⛶ 全螢幕</button>
      </div>

      <!-- 直向轉橫提示 -->
      <div class="rotate-hint" id="rotateHint">
        <div class="rotate-card">
          <div class="rotate-icon">📱↻</div>
          <p>請把裝置轉成<strong>橫向</strong>再玩,紅海走廊才裝得下!</p>
        </div>
      </div>

      <!-- 結算/反思 -->
      <div class="overlay-shell" id="matchOverlay">
        <div class="overlay-card">
          <p class="overlay-eyebrow" id="overlayEyebrow">出埃及記 14:31</p>
          <h2 id="overlayTitle">—</h2>
          <p id="overlayText">—</p>
          <div class="overlay-actions">
            <button id="overlayMenuButton">回選單</button>
            <button id="overlayReplayButton">再走一次</button>
          </div>
        </div>
      </div>

      <!-- 主選單 -->
      <div class="home-screen visible" id="homeScreen">
        <div class="home-card">
          <p class="home-eyebrow">出埃及記 14・耶和華的拯救</p>
          <h1>紅海過乾地</h1>
          <p class="home-sub">後有追兵、前有大海。摩西向海伸杖,水便分開——帶著百姓走乾地過去,一個也不失落。</p>

          <div class="home-row">
            <label for="difficultySelect">難度</label>
            <select id="difficultySelect">
              <option value="kids">幼兒(短走廊)</option>
              <option value="child">兒童</option>
              <option value="easy" selected>入門</option>
              <option value="normal">標準</option>
              <option value="hard">職業(長走廊)</option>
            </select>
            <label for="audioSelect">音效</label>
            <select id="audioSelect">
              <option value="on" selected>開啟</option>
              <option value="off">靜音</option>
            </select>
          </div>

          <p class="home-hint" id="modeHint">A/D 或 ←/→ 左右帶路,避開礁石、照顧掉隊的人(他們一定會趕上——放慢等等就好)。海不是摩西分開的,是耶和華(出14:21);你的工作是把神託付的人一個一個帶過去。永遠不會輸。</p>
          <button class="start-button" id="startButton">開始</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script>
    try {
      if (location.hostname.endsWith('netlify.app')) {
        navigator.sendBeacon?.('https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=redsea3d');
      }
    } catch (_) {}
    </script>
  </body>
</html>
